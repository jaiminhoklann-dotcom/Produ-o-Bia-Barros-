<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111010" />
  <meta name="description" content="Agenda, riders e logística dos shows Bia Barros" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bia Produção" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <title>Bia Barros • Produção de Estrada</title>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><img src="./logo.png" alt="Logo Bia Barros" /><span>PRODUÇÃO DE ESTRADA</span></div>
      <nav id="side-nav" aria-label="Navegação">
        <button class="nav-item active" data-nav="inicio"><span>⌂</span> Início</button>
        <button class="nav-item" data-nav="agenda"><span>▦</span> Agenda de shows</button>
        <button class="nav-item" data-nav="checklist"><span>☑</span> Checklists</button>
        <button class="nav-item" data-nav="cronograma"><span>◷</span> Cronograma</button>
        <button class="nav-item" data-nav="riders"><span>▤</span> Riders em PDF</button>
        <button class="nav-item" data-nav="contatos"><span>♧</span> Contatos</button>
        <button class="nav-item" data-nav="ajustes"><span>⚙</span> Ajustes e backup</button>
      </nav>
      <div class="side-footer">BIA BARROS<br/><small>Produção organizada, show tranquilo.</small></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><span class="eyebrow">BIA BARROS • PRODUÇÃO</span><h1 id="page-title">Visão geral</h1></div><button id="top-add" class="btn primary">＋ Novo show</button></header>
      <div id="content" aria-live="polite"></div>
    </main>
    <nav class="bottom-nav" aria-label="Menu inferior">
      <button data-nav="inicio" class="active"><span>⌂</span>Início</button>
      <button data-nav="agenda"><span>▦</span>Agenda</button>
      <button data-nav="checklist"><span>☑</span>Lista</button>
      <button data-nav="cronograma"><span>◷</span>Cronograma</button>
      <button data-nav="riders"><span>▤</span>Rider</button>
      <button data-nav="contatos"><span>♧</span>Contatos</button>
    </nav>
  </div>
  <dialog id="modal"><form id="modal-form" method="dialog"><div class="modal-head"><h2 id="modal-title"></h2><button type="button" id="close-modal" class="close" aria-label="Fechar">×</button></div><div id="modal-body"></div><div id="modal-actions"></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
